[tasks.dependencies]
description = "Install npm packages from the lockfile"
run = "npm ci"

[tasks.test]
description = "Run lint, tests, build, and package validation for every plugin"
depends = ["dependencies"]
run = "npm run validate"

[tasks.check-clean]
description = "Fail if the git working tree has uncommitted files"
run = '''
set -euo pipefail
if [ -n "$(git status --porcelain)" ]; then
  echo "Refusing to continue with uncommitted files:" >&2
  git status --short >&2
  exit 1
fi
'''

[tasks.publish]
description = "Push, validate, and publish one plugin package to npm"
usage = 'arg "<package>" help="Plugin directory under packages/: lutron, venstar, wac, or yale"'
depends = ["push"]
run = '''
set -euo pipefail
if [ ! -f "packages/${usage_package}/package.json" ]; then
  echo "Unknown package: ${usage_package}" >&2
  exit 1
fi
npm run validate
mise run check-clean
# Publish with NPM_TOKEN, from the environment or the .env files `mr secrets` writes, through a
# throwaway userconfig so the token never lands in ~/.npmrc. Without a token, npm asks you to log in.
token="${NPM_TOKEN:-}"
if [ -z "${token}" ]; then
  token="$(grep -h '^NPM_TOKEN=' .env .env.* 2>/dev/null | head -n 1 | cut -d= -f2- | sed -e 's/^"//' -e 's/"$//' || true)"
fi
if [ -z "${token}" ]; then
  npm publish --workspace "packages/${usage_package}"
  exit 0
fi
userconfig="$(mktemp)"
trap 'rm -f "${userconfig}"' EXIT
chmod 600 "${userconfig}"
printf '//registry.npmjs.org/:_authToken=%s\n' "${token}" > "${userconfig}"
if ! user="$(npm whoami --userconfig "${userconfig}" 2>/dev/null)"; then
  echo "NPM_TOKEN was rejected by npm; create a new token and store it with mr secrets set NPM_TOKEN" >&2
  exit 1
fi
echo "Publishing packages/${usage_package} as ${user}"
npm publish --workspace "packages/${usage_package}" --userconfig "${userconfig}"
'''

[tasks.push]
description = "Fetch and safely push main to origin"
depends = ["check-clean"]
run = '''
set -euo pipefail
if [ "$(git remote get-url origin)" != "git@github.com:grahamotte/HomebridgeGo.git" ]; then
  echo "Refusing to push: origin must point to the GitHub workflow repository" >&2
  exit 1
fi
if [ "$(git remote)" != "origin" ]; then
  echo "Refusing to push: this repository must have only origin" >&2
  exit 1
fi
git fetch origin
git merge-base --is-ancestor origin/main main
git push origin main:refs/heads/main
'''

[tasks.dev]
description = "Run one plugin in a local Homebridge that rebuilds on every change"
usage = 'arg "<package>" help="Plugin directory under packages/: lutron, venstar, wac, or yale"'
depends = ["dependencies"]
run = '''
set -euo pipefail
if [ ! -f "packages/${usage_package}/package.json" ]; then
  echo "Unknown package: ${usage_package}" >&2
  exit 1
fi
npm run watch --workspace "packages/${usage_package}"
'''
